# Copy this file to catalog/<your-id>.yaml, then replace every example value.
# This file is documentation only: validators, the index builder, and the
# reachability checker process catalog/*.yaml, not docs/*.yaml.
# The placeholder lifecycle value and URL below are intentionally invalid until
# you replace them; this file must never be submitted unchanged.
id: example-dataset
type: dataset
title: Replace with the real dataset title
description: >
  Replace this description with what the resource is and why it matters.
publisher: Replace with the authoritative publisher
topics: [replace-me]
source:
  canonical_url: https://example.invalid
  identifiers:
    doi: null
access:
  method: [web]
  auth_required: false
  auth_note: null
  rate_limit: null
format: [replace-me]
coverage:
  spatial: replace-me
  temporal: replace-me
  cadence: irregular
license: replace-me
attribution: Replace with the publisher attribution
# observed = machine facts only. Verify the URL and replace checked with
# YYYY-MM-DD before submitting; scripts/check_links.py fills the rest from a probe.
observed:
  checked: YYYY-MM-DD
  reachable: null
  http_status: null
  final_url: null
  redirect_chain: []
  fingerprint_result: no-baseline
status: replace-me
status_since: null
status_source: curator
recovery: []
notes: null
