name: propagate-engine

# Pushes engine files (schema, scripts, CI, deps) out to every vertical repo
# whenever they change on main, opening one PR per vertical. Never auto-merges —
# each vertical's own CI (also propagated) is the gate a human reviews before merge.
#
# Requires an org secret ENGINE_PROPAGATION_TOKEN: a PAT (fine-grained,
# contents: write + pull-requests: write) scoped to the vertical repos below.
# GITHUB_TOKEN cannot be used because it has no cross-repo write access.

on:
  push:
    branches: [main]
    paths:
      - schema/catalog-entry.schema.json
      - scripts/validate.py
      - scripts/build_index.py
      - scripts/check_links.py
      - scripts/alert_on_dead_links.py
      - scripts/migrate_v1_v2.py
      - requirements.txt
      - requirements-headless.txt
      - pyproject.toml
      - tests/test_catalog.py
      - .github/workflows/ci.yml
      - .github/workflows/link-check.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  propagate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vertical:
          - agriculture-almanac
          - civic-almanac
          - climate-almanac
          - economy-almanac
          - education-almanac
          - energy-almanac
          - environment-almanac
          - health-almanac
          - justice-almanac
          - science-almanac
          - transportation-almanac
    steps:
      - name: Checkout template
        uses: actions/checkout@v4
        with:
          path: template

      - name: Checkout vertical
        uses: actions/checkout@v4
        with:
          repository: almanac-data/${{ matrix.vertical }}
          token: ${{ secrets.ENGINE_PROPAGATION_TOKEN }}
          path: vertical

      - name: Copy engine files
        id: copy
        env:
          # Through env, never interpolated into the shell body — the matrix
          # values are a controlled literal list, but the fleet's convention is
          # that nothing reaches a `run:` block through ${{ }}.
          VERTICAL: ${{ matrix.vertical }}
        run: |
          set -euo pipefail
          paths=(
            schema/catalog-entry.schema.json
            scripts/validate.py
            scripts/build_index.py
            scripts/check_links.py
            scripts/alert_on_dead_links.py
            scripts/migrate_v1_v2.py
            requirements.txt
            requirements-headless.txt
            pyproject.toml
            tests/test_catalog.py
            .github/workflows/ci.yml
            .github/workflows/link-check.yml
          )

          # Engine paths a specific vertical owns locally, as "vertical:path".
          # MUST mirror LOCAL_OVERRIDES in the org meta-repo's
          # scripts/propagate-engine.sh (almanac-data/almanac-data).
          #
          # That script has always honoured these; this workflow did not. The
          # divergence was harmless only by accident: the manual script's copy
          # list carries CONTRIBUTING.md, SCHEMA-V2.md and AGENTS.md and this
          # one does not, so no overridden file was ever in reach. Adding a
          # prose file to `paths` above would have silently overwritten a
          # steward's work — the exact failure the script's own comment says
          # this list exists to prevent.
          #
          # Two lists, one policy, and only one of them knew about the
          # exception. If you add a path above, check it against this.
          local_overrides=(
            "climate-almanac:CONTRIBUTING.md"
            "climate-almanac:AGENTS.md"
          )

          changed=0
          for rel in "${paths[@]}"; do
            src="template/$rel"
            dst="vertical/$rel"
            if printf '%s\n' "${local_overrides[@]}" | grep -qxF "${VERTICAL}:${rel}"; then
              echo "LOCAL OVERRIDE, not propagated: ${VERTICAL}:${rel}"
              continue
            fi
            if [[ ! -f "$src" ]]; then
              echo "SKIP missing in template: $rel"
              continue
            fi
            if [[ -f "$dst" ]] && cmp -s "$src" "$dst"; then
              continue
            fi
            mkdir -p "$(dirname "$dst")"
            cp "$src" "$dst"
            echo "+ $rel"
            changed=1
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: steps.copy.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.ENGINE_PROPAGATION_TOKEN }}
        run: |
          set -euo pipefail
          cd vertical
          branch="propagate-engine/${GITHUB_SHA::7}"
          git checkout -B "$branch"
          git config user.name "almanac-engine-bot"
          git config user.email "engine-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore(engine): propagate changes from almanac-template@${GITHUB_SHA::7}"
          git push -f origin "$branch"
          if gh pr view "$branch" --repo "almanac-data/${{ matrix.vertical }}" >/dev/null 2>&1; then
            echo "PR already open for $branch"
          else
            gh pr create \
              --repo "almanac-data/${{ matrix.vertical }}" \
              --title "chore(engine): propagate changes from almanac-template" \
              --body "Automated propagation of engine files (schema, scripts, CI, deps) from almanac-data/almanac-template@${GITHUB_SHA}. This PR does not auto-merge — check the CI run below before merging. A schema change may require migrating existing catalog entries." \
              --head "$branch" \
              --base main
          fi

  # A propagation that fails silently is worse than no propagation: the engine
  # keeps moving in the template while eleven verticals quietly stop receiving
  # it, and nothing surfaces until someone diffs by hand. That happened — the
  # ENGINE_PROPAGATION_TOKEN expired and every job died on "Bad credentials"
  # for weeks with no signal.
  #
  # Deliberately on GITHUB_TOKEN, not the propagation PAT: the most likely
  # thing to break IS that PAT, so an alert authenticated with it would be
  # silent in exactly the case it exists to report.
  alert-on-failure:
    needs: [propagate]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or refresh the propagation-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="propagate-engine is failing — verticals are not receiving engine changes"
          body=$(printf '%s\n' \
            "Propagation from \`almanac-template\` failed on commit \`${GITHUB_SHA}\`." \
            "" \
            "**The eleven vertical repos are no longer receiving engine updates.** Any" \
            "schema, script, CI, or test change merged here since this started has not" \
            "reached them, and nothing else will surface that." \
            "" \
            "Failed run: ${RUN_URL}" \
            "" \
            "Most common cause: \`ENGINE_PROPAGATION_TOKEN\` has expired (the jobs fail" \
            "with \`Bad credentials\` at the vertical checkout). It is a PAT and PATs" \
            "expire; re-issue it with contents:write + pull-requests:write scoped to the" \
            "vertical repos, or move the propagation onto a GitHub App so there is" \
            "nothing left to expire." \
            "" \
            "This issue is reopened and updated by every failing run. It stays open" \
            "until a propagation succeeds — closing it without fixing the cause just" \
            "restores the silence.")
          existing=$(gh issue list --repo "$REPO" --state all --label propagation-failure \
                      --json number,state --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue reopen "$existing" --repo "$REPO" 2>/dev/null || true
            gh issue comment "$existing" --repo "$REPO" --body "$body"
            echo "refreshed issue #$existing"
          else
            gh label create propagation-failure --repo "$REPO" \
              --color B60205 --description "propagate-engine could not reach the verticals" 2>/dev/null || true
            gh issue create --repo "$REPO" --title "$title" --body "$body" --label propagation-failure
          fi
